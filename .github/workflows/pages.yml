# Builds the Hugo site in website/ and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede a queued deploy, but never cancel one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned to the version the site is developed against.
      HUGO_VERSION: 0.160.1
      HUGO_ENVIRONMENT: production
      TZ: UTC
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Test
        run: bun test website/assets/breath.test.js

      - name: Install Hugo
        run: |
          curl -fsSL -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_url is the real origin plus any path prefix, e.g. https://user.github.io/repo
      # or a custom domain, so canonical and og:url come out right with no hand-edited SITE_URL.
      - name: Build
        run: |
          hugo --source website --config data/site.yaml \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --minify --printI18nWarnings --panicOnWarning

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
